[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nba-prob"
version = "0.2.0"
description = "As-of NBA probability forecasts and reproducible walk-forward evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6,<7",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ui = ["streamlit>=1.50,<2"]

[project.scripts]
nbaprob = "nbaprob.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nbaprob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
